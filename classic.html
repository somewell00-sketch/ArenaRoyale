<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Arena Royale</title>
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Rajdhani:wght@500;600;700&display=swap');

:root{
  --bg: #111113;           /* Ebony */
  --panel: #2b1512;        /* near Carafe */
  --card: #1a1413;
  --text: #f0f0f2;
  --muted: #b9a6a1;

  --primary: #9f0bcf;      /* Desert Sun */
  --primary-2: #da1deb;
  --accent: #fad02c;       /* Yellow */
  --danger: #ff3b3b;

  --border: rgba(250,208,44,0.18);
  --shadow: 0 10px 30px rgba(0,0,0,0.35);
  --radius: 14px;
  /* Typography: body vs HUD */
  --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  --body: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  --hud: "Rajdhani", "Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
}

*{ box-sizing:border-box; }

html,body{
  height:100%;
  margin:0;
  background: radial-gradient(1200px 900px at 20% 10%, rgba(195,106,45,0.22), transparent 55%),
              radial-gradient(1000px 800px at 90% 40%, rgba(250,208,44,0.12), transparent 60%),
              var(--bg);
  color:var(--text);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

html{ font-size: 16px; }

a{ color: var(--accent); }

.app{
  display:grid;
  grid-template-columns: 240px 1fr 400px;
  gap:16px;
  padding:16px;
  height:100vh;
}

.screen{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
}

.card{
  width:min(720px, 100%);
  background: linear-gradient(180deg, rgba(70,31,24,0.65), rgba(17,17,19,0.85));
  border: 1px solid rgba(250,208,44,0.18);
  border-radius: var(--radius);
  padding:18px;
  box-shadow: var(--shadow);
}
.banner-hero {
    font-size: 36px;
    height: 240px;
    color: rgba(240, 240, 242, 0.85);
    padding: 12px 12px;
    border-radius: 14px;
    background: url(bg/arena.png);
    background-position: center;
    background-repeat: no-repeat;
    border: 1px solid rgba(250, 208, 44, 0.18);
}
.panel{
  background: linear-gradient(180deg, rgba(70,31,24,0.85), rgba(17,17,19,0.92));
  border:1px solid rgba(250,208,44,0.18);
  border-radius: var(--radius);
  padding:14px;
  box-shadow: var(--shadow);
  overflow:auto;
}

.canvasWrap{
  position:relative;
  border-radius: var(--radius);
  overflow:hidden;
  border: 1px solid rgba(250,208,44,0.18);
  box-shadow: var(--shadow);

  /* Keep the canvas centered even when the grid column is larger */
  display:flex;
  align-items:center;
  justify-content:center;

  /* Biome backgrounds: overlay gradient + procedural texture */
  background-position: center, center;
  background-size: cover, cover;
  background-repeat: no-repeat, repeat;
}

/* Prevent touch scrolling while dragging the map on mobile */
.canvasWrap canvas{
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  display:block;
}

.minimap{
  position:absolute;
  left: 12px;
  bottom: 64px;
  width: 200px;
  height: 200px;
  border-radius: 14px;
  border: 1px solid rgba(250,208,44,0.25);
  background: rgba(12,12,14,0.25);
  box-shadow: 0 16px 50px rgba(0,0,0,0.45);
  z-index: 6;
}

.h1{ font-family: var(--hud); font-size:26px; font-weight:700; letter-spacing:0.6px; text-transform: uppercase; }
.h2{ font-family: var(--hud); font-size:20px; font-weight:700; letter-spacing:0.5px; }
.muted{ color:var(--muted); }
.small{ font-size:13px; }
.sep{ border:0; border-top:1px solid rgba(250,208,44,0.18); margin:12px 0; }

.row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.row.space{ justify-content:space-between; }

.select{
  background: rgba(17,17,19,0.7);
  color: var(--text);
  border: 1px solid rgba(250,208,44,0.22);
  padding: 8px 10px;
  border-radius: 10px;
  font-size: 18px;
}

.input{
  width:100%;
  background: rgba(17,17,19,0.7);
  color: var(--text);
  border: 1px solid rgba(250,208,44,0.22);
  padding: 8px 10px;
  border-radius: 10px;
  font-size: 15px;
}

.btn{
  font-family: var(--hud);
  font-size: 24px;
  letter-spacing: 0.35px;
  background: rgba(17,17,19,0.55);
  color: var(--text);
  border: 1px solid rgba(250,208,44,0.22);
  padding: 9px 12px;
  border-radius: 12px;
  cursor:pointer;
}

.btn:disabled{
  opacity:0.45;
  cursor:not-allowed;
}

.btn:hover{ border-color: rgba(250,208,44,0.45); }
.btn:disabled{
  opacity:0.5;
  cursor:not-allowed;
}
.btn.primary{
  background: linear-gradient(180deg, var(--primary), rgb(255 69 220 / 75%));
    border-color: rgb(255 58 251 / 25%);
}

.pill{
  display:inline-flex;
  gap:8px;
  align-items:center;
  padding:6px 10px;
  border-radius: 999px;
  background: rgba(17,17,19,0.6);
  border: 1px solid rgba(250,208,44,0.18);
}

/* Numeric styling for stats-like text without changing markup */
.kv > div:nth-child(even),
.attrRowVal,
.attrTotalValue,
.attrRowMin, .attrRowMax{
  font-variant-numeric: tabular-nums;
}

.swatch{
  width:12px; height:12px; border-radius:4px;
  display:inline-block;
  border:1px solid rgba(250,208,44,0.25);
}

.kv{
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap:8px 10px;
  margin-top:10px;
}
.kv > div:nth-child(odd){ color:var(--muted); }
.kv > div:nth-child(even){ text-align:right; font-family: var(--mono); }

textarea{
  width:100%;
  min-height:84px;
  background: rgba(17,17,19,0.55);
  color: var(--text);
  border: 1px solid rgba(250,208,44,0.18);
  border-radius: 12px;
  padding:10px;
}

.hint{
  position:absolute;
  left:12px;
  bottom:12px;
  font-size:12px;
  color: rgba(240,240,242,0.75);
  padding:6px 10px;
  border-radius: 999px;
  background: rgba(17,17,19,0.55);
  border: 1px solid rgba(250,208,44,0.18);
}

.modalOverlay{
  position:fixed;
  z-index: 1000;
  inset:0;
  background: rgba(0,0,0,0.65);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
}

.modal{
  width:min(560px, 100%);
  background: linear-gradient(180deg, rgba(70,31,24,0.92), rgba(17,17,19,0.96));
  border: 1px solid rgba(250,208,44,0.25);
  border-radius: var(--radius);
  padding:16px;
  box-shadow: var(--shadow);
}

.section{ margin-top:12px; }
.section h3{ margin: 0 0 8px 0; font-size: 14px; color: var(--muted); }

.list{ display:flex; flex-direction:column; gap:8px; margin:8px 0 0; }

.debugRow{ display:flex; flex-direction:column; gap:6px; padding:10px; border:1px solid var(--border); border-radius:14px; background:rgba(255,255,255,0.02); }
.debugMeta{ display:flex; gap:6px; flex-wrap:wrap; }
.pill strong{ margin-right:auto; }


.banner{
  font-size: 14px;
  line-height: 1.35;
  color: rgba(240,240,242,0.85);
  padding: 10px 12px;
  border-radius: 14px;
  background: rgba(17,17,19,0.55);
  border: 1px solid rgba(250,208,44,0.18);
}

.banner.danger{
  background: rgba(255, 59, 59, 0.10);
  border: 1px solid rgba(255, 59, 59, 0.35);
}

.eventList{
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 260px;
  overflow: auto;
}

/* --- Start screen: horizontal stacked attribute sliders --- */
.attrStack{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.attrRow{
  display:grid;
  grid-template-columns: 150px 22px 1fr 22px 36px;
  gap:10px;
  align-items:center;
  padding:10px 12px;
  border-radius: 14px;
  background: rgba(17,17,19,0.32);
  border: 1px solid rgba(250,208,44,0.18);
}

.attrRowLabel{ font-weight: 750; }
.attrName{ color: rgba(240,240,242,0.95); }
.attrRowMin, .attrRowMax{ color: rgba(240,240,242,0.65); font-family: var(--mono); font-size: 12px; }
.attrRowVal{ text-align:right; font-family: var(--mono); font-weight: 800; }

.attrTotalRow{
  display:flex;
  gap:10px;
  align-items:baseline;
  padding:10px 12px;
  border-radius: 14px;
  background: rgba(17,17,19,0.22);
  border: 1px solid rgba(250,208,44,0.18);
}

.attrTotalLabel{ color: rgba(240,240,242,0.85); font-weight: 750; }
.attrTotalValue{ font-family: var(--mono); font-size: 16px; font-weight: 900; }
.attrTotalHint{ margin-left:auto; font-family: var(--mono); font-size: 12px; color: rgba(240,240,242,0.78); }

/* Palette-styled range input */
.hSlider{
  width: 100%;
  accent-color: #FFFFFF;
}

.hSlider:focus{ outline: none; }

/* WebKit */
.hSlider::-webkit-slider-runnable-track{
  height: 10px;
  border-radius: 999px;
  background: linear-gradient(90deg, rgba(80,0,180,0.6), rgba(180,0,255,0.9));
  border: 1px solid rgba(250,208,44,0.18);
}

.hSlider::-webkit-slider-thumb{
  -webkit-appearance: none;
  appearance: none;
  margin-top: -5px;
  width: 20px;
  height: 20px;
  border-radius: 999px;
  background: rgba(17,17,19,0.92);
  border: 2px solid rgba(250,208,44,0.75);
  box-shadow: 0 6px 14px rgba(0,0,0,0.35);
}

/* Firefox */
.hSlider::-moz-range-track{
  height: 10px;
  border-radius: 999px;
  background: linear-gradient(90deg, rgba(195,106,45,0.9), rgba(250,208,44,0.6));
  border: 1px solid rgba(250,208,44,0.18);
}

.hSlider::-moz-range-thumb{
  width: 20px;
  height: 20px;
  border-radius: 999px;
  background: rgba(17,17,19,0.92);
  border: 2px solid rgba(250,208,44,0.75);
  box-shadow: 0 6px 14px rgba(0,0,0,0.35);
}

.eventLine{
  padding: 10px 12px;
  border-radius: 12px;
  background: rgba(17,17,19,0.55);
  border: 1px solid rgba(250,208,44,0.12);
  color: rgba(240,240,242,0.88);
  font-size: 14px;
}

/* ===== New UI: action + movement flow ===== */

.panelHeader{ display:flex; flex-direction:column; gap:2px; }

.fallenTributes{
  font-family: var(--hud);
  font-size: 14px;
  opacity: 0.72;
  margin-top: 2px;
  letter-spacing: 0.4px;
}

.hidden{ display:none !important; }

.alert{
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: 14px;
  background: rgba(255, 59, 59, 0.12);
  border: 1px solid rgba(255, 59, 59, 0.35);
  color: rgba(240,240,242,0.95);
  font-size: 14px;
}

.btn.blue{
  background: rgba(66, 133, 244, 0.18);
  border-color: rgba(66, 133, 244, 0.45);
}

.btn.red{
  background: rgba(255, 59, 59, 0.18);
  border-color: rgba(255, 59, 59, 0.45);
}

.btn.green{
  background: rgba(0, 200, 180, 0.18);
  border-color: rgba(0, 200, 180, 0.45);
}

.btn.teal{
  background: rgba(0, 160, 220, 0.18);
  border-color: rgba(0, 160, 220, 0.45);
}

.btn.purple{
  background: rgba(126, 87, 194, 0.18);
  border-color: rgba(126, 87, 194, 0.45);
}

.btn.orange{
  background: rgba(251, 140, 0, 0.18);
  border-color: rgba(251, 140, 0, 0.45);
}

.btn.ghost{
  background: transparent;
  border-style: dashed;
}

.pillWrap{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.miniPillWrap{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.miniPill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding: 6px 10px;
  border-radius: 12px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.10);
}

.miniPill .pillIcon{
  font-size: 14px;
  line-height: 1;
}

.playerPill{
  display:inline-flex;
  gap:8px;
  align-items:center;
  padding: 7px 10px;
  border-radius: 999px;
  background: rgba(17,17,19,0.55);
  border: 1px solid rgba(250,208,44,0.18);
  color: var(--text);
  cursor: default;
}

.playerPill.selectable{ cursor:pointer; }
.playerPill.selectable:hover{ border-color: rgba(250,208,44,0.45); }
.playerPill.selected{ outline: 2px solid rgba(255, 59, 59, 0.55); }

.pillName{ font-weight:700; }
.pillIcon{ font-size: 14px; line-height: 1; }

.pillSub{ color: rgba(240,240,242,0.70); font-size: 12px; }

/* Inventory pills */
.itemPill{
  display:inline-flex;
  gap:8px;
  align-items:center;
  padding: 7px 10px;
  border-radius: 999px;
  background: rgba(17,17,19,0.55);
  border: 1px solid rgba(250,208,44,0.18);
  color: var(--text);
  cursor:pointer;
}

.itemPill .pillRemove{
  margin-left: 6px;
  width: 18px;
  height: 18px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  line-height: 1;
  color: rgba(240,240,242,0.75);
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.12);
}

.itemPill .pillRemove:hover{
  color: rgba(255,255,255,0.95);
  border-color: rgba(250,208,44,0.45);
  background: rgba(250,208,44,0.10);
}

.itemPill:hover{ border-color: rgba(250,208,44,0.45); }

.itemPill.emptySlot{
  cursor: default;
  opacity: 0.55;
  border-style: dashed;
  border-color: rgba(250,208,44,0.16);
  background: rgba(17,17,19,0.35);
}

.itemPill.emptySlot:hover{ border-color: rgba(250,208,44,0.16); }

.itemPill.equipped{ outline: 2px solid rgba(250,208,44,0.55); }
.itemPill.defEquipped{ outline: 2px solid rgba(66,133,244,0.55); }
.itemPill.ground.selected{ outline: 2px solid rgba(250,208,44,0.55); }


.pillBadge{
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(195,106,45,0.18);
  border: 1px solid rgba(195,106,45,0.35);
  font-size: 11px;
  color: rgba(240,240,242,0.88);
}

/* Small confirm overlay */
.confirmOverlay.hidden{ display:none !important; }
.confirmOverlay{
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index: 50;
}

.confirmCard{
  width: 320px;
  padding: 14px 14px 12px 14px;
  border-radius: 16px;
  background: rgba(17,17,19,0.92);
  border: 1px solid rgba(250,208,44,0.18);
  box-shadow: 0 20px 60px rgba(0,0,0,0.55);
}

/* --- UI Tooltip (custom, replaces browser title tooltip) --- */
.uiTooltip.hidden{ display:none !important; }
.uiTooltip{
  position: fixed;
  z-index: 999;
  max-width: 360px;
  padding: 12px 14px;
  border-radius: 14px;
  background: linear-gradient(180deg, rgba(34,26,24,0.98), rgba(14,14,16,0.98));
  border: 1px solid rgba(250,208,44,0.55);
  box-shadow: 0 22px 70px rgba(0,0,0,0.70);
  color: rgba(240,240,242,0.95);
  font-size: 13px;
  line-height: 1.35;
  white-space: pre-line;
  pointer-events: none;
  backdrop-filter: blur(6px);
}

/* Small (?) helper icon used in the start screen */
.helpIcon{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width: 18px;
  height: 18px;
  border-radius: 999px;
  border: 1px solid rgba(250,208,44,0.35);
  background: rgba(250,208,44,0.10);
  color: rgba(250,208,44,0.95);
  font-size: 12px;
  font-weight: 700;
  line-height: 1;
  cursor: help;
  user-select:none;
}

/* --- Right panel: compact status + bars --- */
.poisonIcon{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width: 18px;
  height: 18px;
  border-radius: 999px;
  border: 1px solid rgba(134,255,120,0.40);
  background: rgba(134,255,120,0.12);
  color: rgba(134,255,120,0.95);
  font-size: 12px;
  line-height: 1;
}

.statBlock{ margin-top: 2px; }
.statLine{ display:flex; justify-content:space-between; align-items:baseline; }
.statBar{
  width:100%;
  height: 10px;
  border-radius: 999px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  overflow:hidden;
}
.statFill{
  height: 100%;
  width: 0%;
  border-radius: 999px;
}
.statFill.good{ background: rgba(26,255,0,0.85); }
.statFill.warn{ background: rgba(255,177,0,0.85); }
.statFill.bad{ background: rgba(255,0,90,0.85); }

.slotRow{ display:flex; flex-wrap:wrap; gap:8px; }
.slotPill{
  display:inline-flex;
  align-items:center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 999px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.14);
  color: rgba(240,240,242,0.95);
  font-size: 13px;
  line-height: 1;
}

/* Slightly stronger affordance when an element has a tooltip */
[data-tooltip]{
  text-decoration: none;
}
.playerPill[data-tooltip],
.itemPill[data-tooltip],
.btn[data-tooltip]{
  cursor: help;
}

.areaInfo{
  position:absolute;
  right:12px;
  bottom:12px;
  width: 220px;
  padding: 10px 12px;
  border-radius: 14px;
  background: rgba(17,17,19,0.70);
  border: 1px solid rgba(250,208,44,0.18);
  pointer-events:none;
}

.tiny{ font-size: 11px; }

/* Debug: compact cards */
.debugCard{
  padding: 8px 10px;
  border: 1px solid rgba(250,208,44,0.18);
  border-radius: 12px;
  background: rgba(255,255,255,0.02);
  display:flex;
  flex-direction:column;
  gap:6px;
}

.debugCard.dead{ opacity: 0.55; }

.debugTop{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.debugBottom{ display:flex; justify-content:space-between; gap:10px; font-family: var(--mono); font-size: 11px; color: rgba(240,240,242,0.85); }

.debugInv{
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.debugItemPill{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 8px;
  border-radius: 999px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.10);
  font-size: 11px;
  line-height: 1;
  color: rgba(240,240,242,0.90);
}


/* Sticky action bar inside scrollable panels */
.actionBar{
  position: sticky;
  bottom: 0;
  margin-top: 12px;
  padding-top: 10px;
  background: rgb(24,18,18);
  border-top: 1px solid rgba(250,208,44,0.18);
  z-index: 2;
}

/* Toasts (top-right of the central map area) */
.toastHost{
  position:absolute;
  top:12px;
  right:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
  align-items:flex-end;
  z-index:60;
  pointer-events:none;
}

.toast{
  pointer-events:auto;
  max-width:min(340px, 70vw);
  background: rgba(17,17,19,0.92);
  border: 1px solid rgba(250,208,44,0.20);
  border-radius: 14px;
  padding: 10px 12px;
  box-shadow: 0 12px 26px rgba(0,0,0,0.35);
  color: var(--text);
  font-size: 13px;
  line-height: 1.25;
  opacity: 1;
  transform: translateY(0);
  transition: opacity 180ms ease, transform 180ms ease;
}

.toast .toastLine{ margin-top: 4px; }
.toast .toastLine:first-child{ margin-top: 0; }

.toast.event{
  border-color: rgba(250,208,44,0.28);
}
.toast.danger{
  border-color: rgba(255, 88, 88, 0.45);
}
.toast.out{
  opacity: 0;
  transform: translateY(-6px);
}


/* ------------------------------------------------------------
   Map canvas fills its column; the drawing buffer is resized in JS.
   ------------------------------------------------------------ */
.app{ grid-template-areas: "you map actions"; }
#rightPanel{ grid-area: you; }
.canvasWrap{ grid-area: map; min-width: 0; min-height: 0; }
#leftPanel{ grid-area: actions; }
.canvasWrap canvas#c{ width: 100%; height: 100%; }

/* Zoom controls (top-left of the map) */
.mapZoom{
  position:absolute;
  top:12px;
  left:12px;
  display:flex;
  gap:6px;
  z-index: 8;
}
.zoomBtn{
  min-width: 36px;
  height: 36px;
  padding: 0 10px;
  border-radius: 10px;
  border: 1px solid rgba(250,208,44,0.28);
  background: rgba(17,17,19,0.80);
  color: var(--text);
  font: 600 18px/1 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  cursor: pointer;
}
.zoomBtn.wide{ font-size: 13px; }
.zoomBtn:hover{ background: rgba(40,32,28,0.92); }
.zoomBtn:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

/* Laptop: shrink side columns a little */
@media (max-width: 1360px){
  .app{ grid-template-columns: 220px 1fr 340px; gap: 12px; padding: 12px; }
  .minimap{ width: 150px; height: 150px; }
}

/* Tablet: map + actions on top, your panel underneath the map */
@media (max-width: 1100px){
  .app{
    height: auto;
    min-height: 100vh;
    grid-template-columns: 1fr 340px;
    grid-template-areas:
      "map actions"
      "you actions";
    grid-template-rows: 62vh auto;
  }
  #leftPanel{ max-height: calc(100vh - 24px); position: sticky; top: 12px; align-self: start; }
  .hint{ display: none; }
  .minimap{ width: 120px; height: 120px; bottom: 12px; }
}

/* Phone: single column — map, then actions, then you */
@media (max-width: 900px){
  .app{
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "map" "actions" "you";
    grid-template-rows: 58vh auto auto;
    gap: 10px;
    padding: 10px;
  }
  #leftPanel{ position: static; max-height: none; overflow: visible; }
  #rightPanel{ overflow: visible; }
  .actionBar{ bottom: 0; margin-left: -14px; margin-right: -14px; padding: 10px 14px; }
  .minimap{ width: 96px; height: 96px; bottom: 12px; left: 8px; }
  .btn{ font-size: 18px; }
  .areaInfo{ width: auto; max-width: 52%; right: 8px; bottom: 8px; padding: 8px 10px; }
  .toastHost{ left: 8px; right: 8px; top: 54px; align-items: stretch; }
  .toast{ max-width: none; }
  .h1{ font-size: 22px; }

}

/* Keep the bottom hint from running under the area card */
.hint{ max-width: calc(100% - 270px); }

/* Senses: what your tribute perceives around them */
.senses{
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: 12px;
  background: rgba(10,10,12,0.45);
  border: 1px solid rgba(250,208,44,0.14);
}
.sensesTitle{ font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(240,240,242,0.6); margin-bottom: 6px; }
.sensesList{ list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.sensesList li{ font-size: 13px; line-height: 1.35; font-style: italic; color: rgba(240,240,242,0.88); padding-left: 14px; position: relative; }
.sensesList li::before{ content: "›"; position: absolute; left: 0; color: rgba(250,208,44,0.6); font-style: normal; }
.sensesList li.monster, .sensesList li.danger{ color: #ffb4a8; }
.sensesList li[data-area]{ cursor: default; }

/* Night sky card */
.nightCard{
  position:absolute; inset:0; z-index: 40;
  display:flex; align-items:center; justify-content:center;
  background: radial-gradient(ellipse at 50% 20%, rgba(30,40,80,0.55), rgba(4,6,14,0.88));
  padding: 16px;
}
.nightInner{
  width: min(520px, 100%);
  max-height: 100%;
  overflow:auto;
  padding: 18px 20px;
  border-radius: 16px;
  background: rgba(8,10,20,0.82);
  border: 1px solid rgba(160,190,255,0.22);
  box-shadow: 0 30px 80px rgba(0,0,0,0.6);
}
.nightKicker{ font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: rgba(190,210,255,0.7); }
.nightTitle{ font-family: var(--hud); font-size: 20px; margin: 4px 0 12px; }
.nightFaces{ display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.nightFace{ display:flex; gap:10px; align-items:center; }
.nightAvatar{
  width: 40px; height: 40px; border-radius: 50%; flex: none;
  display:grid; place-items:center;
  font-weight: 700; color: #dfe8ff;
  background: radial-gradient(circle at 35% 30%, rgba(170,200,255,0.45), rgba(60,80,140,0.25));
  border: 1px solid rgba(170,200,255,0.35);
  box-shadow: 0 0 18px rgba(140,180,255,0.25);
}
.nightName{ font-weight: 600; font-size: 14px; }
.nightDistrict{ font-size: 12px; color: rgba(220,228,255,0.6); }
.nightLines{ margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(160,190,255,0.15); display:grid; gap:6px; font-style: italic; font-size: 13px; }
.nightFoot{ margin-top: 14px; display:flex; gap:12px; align-items:center; justify-content:space-between; }
.nightFoot .btn{ font-size: 18px; padding: 8px 18px; }

/* Journal drawer */
.journalDot{ display:inline-block; width:8px; height:8px; border-radius:50%; background: var(--accent); margin-left:6px; vertical-align: middle; }
.journalDrawer{
  position:absolute; top: 56px; right: 12px; bottom: 12px; z-index: 30;
  width: min(360px, calc(100% - 24px));
  display:flex; flex-direction:column;
  background: rgba(14,12,12,0.94);
  border: 1px solid rgba(250,208,44,0.22);
  border-radius: 14px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}
.journalHead{ display:flex; justify-content:space-between; align-items:center; padding: 10px 12px; border-bottom: 1px solid rgba(250,208,44,0.14); }
.journalBody{ overflow:auto; padding: 8px 12px 12px; }
.journalDay h4{ margin: 12px 0 6px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: rgba(250,208,44,0.75); }
.journalDay p{ margin: 0 0 6px; font-size: 13px; line-height: 1.4; color: rgba(240,240,242,0.88); }
.journalDay p.night{ color: rgba(200,215,255,0.85); font-style: italic; }
.toastAction{
  margin-left: 10px; padding: 3px 10px; border-radius: 8px;
  border: 1px solid rgba(250,208,44,0.4); background: transparent; color: var(--accent); cursor: pointer; font: inherit;
}
.pillCount{ margin-left: 6px; font-size: 11px; padding: 1px 6px; border-radius: 999px; background: rgba(250,208,44,0.14); color: var(--accent); }
.groundMore{ width: 100%; margin-top: 4px; font-style: italic; }
.itemPill.armed{ outline: 2px solid var(--accent); outline-offset: 1px; background: rgba(250,208,44,0.12); }
.btn:disabled{ opacity: 0.45; cursor: not-allowed; }

/* Capitol broadcast (end of game) */
.modal.broadcast{ width: min(600px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; }
.bcKicker{ font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #ff6b6b; }
.bcTitle{ font-family: var(--hud); font-size: 26px; line-height: 1.15; margin: 6px 0 8px; }
.bcLead{ font-style: italic; color: rgba(240,240,242,0.85); }
.bcStats{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
.bcStats div{ text-align:center; padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(250,208,44,0.16); color: rgba(240,240,242,0.7); font-size: 12px; }
.bcStats span{ display:block; font-family: var(--hud); font-size: 24px; color: var(--accent); }
.bcReelTitle{ font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: rgba(240,240,242,0.6); margin-top: 6px; }
.bcReel{ margin: 6px 0 0; padding-left: 0; list-style: none; display:grid; gap: 6px; }
.bcReel li{ font-size: 14px; }
.bcReel b{ color: var(--accent); margin-right: 6px; font-weight: 600; }
.bcJournal{ margin-top: 12px; }
.bcJournal summary{ cursor: pointer; color: rgba(240,240,242,0.75); }
.bcJournalBody{ max-height: 220px; overflow: auto; margin-top: 8px; font-size: 13px; }
.bcJournalBody p{ margin: 0 0 6px; }
.bcJournalBody b{ color: var(--accent); margin-right: 4px; }
.morePill{ border-style: dashed; color: var(--accent); cursor: pointer; }

/* v4: "what just happened" card at the top centre of the map (replaces the toast stack) */
.toastHost{
  top: 58px; left: 50%; right: auto; transform: translateX(-50%);
  width: min(560px, calc(100% - 24px));
  align-items: stretch; gap: 6px;
}
.toast{ max-width: none; font-size: 14px; padding: 10px 14px; border-radius: 12px; background: rgba(14,12,12,0.9); }
.toast:not(:last-child){ opacity: .5; font-size: 12px; padding: 6px 12px; }
.toast:last-child{ border-color: rgba(250,208,44,0.4); box-shadow: 0 14px 34px rgba(0,0,0,.45); }
@media (max-width: 900px){ .toastHost{ top: 54px; left: 50%; right: auto; } }

/* =========================== STAGE MODE =========================== */
/* Map-centred: slim HUD on top, map fills the rest, your area always in the centre,
   the action card anchored next to it, a delicate log bottom-left. */
.app.stage{ grid-template-columns: minmax(0,1fr); grid-template-rows: auto minmax(0,1fr); grid-template-areas: "hud" "map"; height: 100vh; gap: 10px; padding: 10px 12px 12px; }
.app.stage #rightPanel, .app.stage #leftPanel{ display: none !important; }
.app.stage .canvasWrap{ grid-area: map; }
.app.stage .areaInfo, .app.stage .hint{ display: none; }
.app.stage .toastHost{ display: none; }
.app.stage .minimap{ left: auto; right: 12px; bottom: 12px; width: 150px; height: 150px; opacity: .92; }

.stageHud{ grid-area: hud; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; min-height: 38px; padding: 4px 14px; border: 1px solid rgba(250,208,44,0.14); border-radius: 12px; background: rgba(16,12,12,0.85); font-size: 12px; color: rgba(240,240,242,0.72); }
.hudWho{ display: flex; align-items: center; gap: 8px; color: var(--text); font-weight: 500; font-size: 13px; }
.hudPortrait{ width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--accent); display: grid; place-items: center; font-size: 10px; font-weight: 600; }
.hudMut{ color: rgba(240,240,242,0.5); font-weight: 400; font-size: 11px; }
.hudMeter{ display: flex; align-items: center; gap: 7px; }
.hudLbl.body{ color: #ef8f7c; } .hudLbl.energy{ color: var(--accent); }
.hudBar{ width: 76px; height: 3px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden; display: block; }
.hudBar i{ display: block; height: 100%; border-radius: 3px; transition: width .4s, background .4s; }
.hudItems{ display: flex; gap: 4px; flex-wrap: wrap; }
.hudItem{ height: 24px; padding: 0 8px; border-radius: 7px; border: 1px solid rgba(250,208,44,0.18); background: transparent; color: rgba(240,240,242,0.8); font: 11px/1 system-ui, sans-serif; cursor: pointer; }
.hudItem.held{ border-color: var(--accent); color: var(--text); }
.hudItem.armed{ background: rgba(250,208,44,0.15); border-color: var(--accent); }
.hudItem:focus-visible{ outline: 2px solid var(--accent); outline-offset: 1px; }
.hudRight{ margin-left: auto; display: flex; gap: 14px; }
.hudRight b{ color: var(--text); font-weight: 600; }

.youDot{ position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgba(250,208,44,0.18); pointer-events: none; z-index: 6; }
.actionCard{ position: absolute; left: calc(50% + 70px); top: 50%; transform: translateY(-50%); width: min(330px, calc(50% - 90px)); z-index: 7;
  padding: 12px 14px; border-radius: 12px; background: rgba(13,11,12,0.92); border: 1px solid rgba(250,208,44,0.24); box-shadow: 0 14px 40px rgba(0,0,0,0.55); backdrop-filter: blur(6px); font-size: 13px; }
.actionCard::before{ content: ""; position: absolute; left: -62px; top: 50%; width: 62px; height: 1px; background: linear-gradient(90deg, rgba(250,208,44,0.0), rgba(250,208,44,0.5)); }
.acPlace{ font-family: var(--hud); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.acPlace span{ color: rgba(240,240,242,0.45); letter-spacing: .04em; text-transform: none; font-family: system-ui, sans-serif; font-size: 11px; }
.acEvent{ margin: 6px 0 0; font-size: 13px; line-height: 1.5; color: var(--text); }
.acCtx{ margin: 4px 0 0; font-size: 12px; line-height: 1.5; color: rgba(240,240,242,0.62); }
.acCtx .warn, .acWarn, .acBtn small.warn{ color: #ff8f7d; }
.acRow{ display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.acBtn{ display: flex; align-items: center; gap: 7px; min-height: 32px; padding: 5px 10px; border-radius: 8px; border: 1px solid rgba(250,208,44,0.28); background: rgba(250,208,44,0.04); color: var(--text); font: 12px/1.25 system-ui, sans-serif; text-align: left; cursor: pointer; }
.acBtn small{ display: block; font-size: 11px; color: rgba(240,240,242,0.55); }
.acBtn:hover{ background: rgba(250,208,44,0.12); }
.acBtn:focus-visible, .acMore:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
.acBtn.first{ background: var(--accent); color: #1b1400; border-color: var(--accent); font-weight: 600; }
.acBtn.first small{ color: #5a4600; font-weight: 400; }
.acBtn.first small.warn{ color: #7a1500; }
.acBtn.small{ min-height: 28px; padding: 3px 9px; }
.acIc{ font-size: 14px; }
.acMore{ margin-top: 8px; background: none; border: 0; padding: 0; color: rgba(240,240,242,0.55); font-size: 11px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.acHint{ margin-top: 8px; font-size: 11px; color: rgba(240,240,242,0.45); }
.acWarn{ margin-top: 6px; font-size: 11px; }

.stageLog{ position: absolute; left: 12px; bottom: 12px; width: min(360px, 40%); z-index: 6; padding: 8px 10px; border-radius: 10px; background: rgba(13,11,12,0.66); border: 1px solid rgba(250,208,44,0.1); font-size: 11.5px; line-height: 1.45; color: rgba(240,240,242,0.85); }
.stageLog p{ margin: 3px 0 0; }
.stageLog b{ color: rgba(250,208,44,0.7); font-weight: 600; margin-right: 3px; }
.logHead{ display: flex; justify-content: space-between; align-items: center; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: rgba(240,240,242,0.45); }
.logHead button{ background: none; border: 0; padding: 0; color: rgba(250,208,44,0.75); font-size: 11px; cursor: pointer; text-transform: none; letter-spacing: 0; }

@media (max-width: 900px){
  .app.stage{ height: auto; min-height: 100vh; grid-template-rows: auto 78vh; }
  .actionCard{ left: 10px; right: 10px; width: auto; top: auto; bottom: 10px; transform: none; }
  .actionCard::before{ display: none; }
  .stageLog{ display: none; }
  .app.stage .minimap{ display: none; }
  .hudRight{ margin-left: 0; }
}

        y += (a[1] + b[1]) * f;

            x += dx * t;
            y += dy * t;
        }

    dy = py - y;
