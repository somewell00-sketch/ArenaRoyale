<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arena Royale</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rajdhani:wght@500;600&display=swap">
<style>
:root{--bg:#0f0c0d;--ink:#ece8e3;--mute:#8f8983;--soft:#b9b3ac;--gold:#fad02c;--line:rgba(250,208,44,.16);--red:#ff8f7d;--blue:#8fb4ff;--green:#9bd59b}
*{box-sizing:border-box}
body{margin:0;background:#080607;color:var(--ink);font:13px/1.45 Inter,system-ui,sans-serif;min-height:100vh}
.page{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;align-items:flex-start;padding:24px 16px 40px}
.cap{font:600 11px Rajdhani,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0 0 8px 2px}
.frame{position:relative;overflow:hidden;background:var(--bg);border:1px solid #241e1f;border-radius:14px}
.frame.desk{width:min(1180px,calc(100vw - 32px));height:720px}
.frame.phone{width:390px;max-width:calc(100vw - 32px);height:780px;border-radius:34px;border:8px solid #1d1819}
svg.map{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.world.anim{transition:transform .5s cubic-bezier(.3,.7,.2,1)}
svg.map{cursor:grab}svg.map.drag{cursor:grabbing}
.ctrl{position:absolute;right:12px;display:flex;flex-direction:column;gap:6px;z-index:5}
.ctrl button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:rgba(13,11,12,.8);color:var(--soft);font:15px Inter,sans-serif;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px)}
.ctrl button:hover{color:var(--ink);border-color:rgba(250,208,44,.4)}
.ctrl button.on{color:var(--gold);border-color:var(--gold)}
.cell{cursor:default;transition:opacity .25s}
.cell.reach{cursor:pointer}
.hint{position:absolute;font-size:11px;color:var(--mute);pointer-events:none}

/* HUD */
.hud{position:absolute;top:10px;left:10px;right:10px;height:40px;display:flex;align-items:center;gap:14px;padding:0 10px 0 6px;background:rgba(15,12,13,.74);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px);z-index:5}
.ava{width:26px;height:26px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font-size:10px;font-weight:600;flex:none}
.bars{display:flex;flex-direction:column;gap:5px;cursor:pointer;position:relative}
.bar{width:84px;height:3px;border-radius:3px;background:rgba(255,255,255,.1)}
.bar i{display:block;height:3px;border-radius:3px}
.words{font-size:12px;color:var(--soft);white-space:nowrap}
.sep{width:1px;height:16px;background:var(--line)}
.carry{font-size:12px;color:var(--soft);white-space:nowrap}
.carry b{font-weight:500;color:var(--ink)}
.right{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12px;color:var(--soft);white-space:nowrap}
.right strong{color:var(--ink);font-weight:600}
.iconbtn{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--soft);display:grid;place-items:center;cursor:pointer}
.phone .words,.phone .carry,.phone .sep.s1{display:none}
.phone .drawer .slot2.empty{display:none}
.phone .bar{width:56px}
.pop{position:absolute;top:46px;left:0;padding:8px 10px;background:rgba(12,10,11,.96);border:1px solid var(--line);border-radius:10px;font-size:12px;white-space:nowrap;display:none;z-index:9}
.pop.on{display:block}

/* Action card anchored to your area */
.act{position:absolute;width:268px;padding:11px 13px;background:rgba(13,11,12,.94);border:1px solid rgba(250,208,44,.24);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.55);z-index:4}
.act::before{content:"";position:absolute;left:-7px;top:22px;display:none;width:12px;height:12px;background:#0d0b0c;border-left:1px solid rgba(250,208,44,.24);border-bottom:1px solid rgba(250,208,44,.24);transform:rotate(45deg)}
.act h3{margin:0;font:600 13px Rajdhani,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);display:flex;justify-content:space-between}
.act h3 span{font:11px Inter,sans-serif;letter-spacing:0;text-transform:none;color:var(--mute)}
.act p{margin:5px 0 0;font-size:12.5px}
.act .warn{color:var(--red);font-size:12px}
.v-card .btns{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.v-card .btns button{height:28px;padding:0 11px;border-radius:8px;border:1px solid rgba(250,208,44,.3);background:transparent;color:var(--ink);font:12px Inter,sans-serif;cursor:pointer}
.v-card .btns button.pri{background:var(--gold);border:0;color:#1b1400;font-weight:600}
.v-card .btns button.more{width:28px;padding:0;color:var(--soft);border-color:var(--line)}
.phone .act{left:10px!important;right:10px;top:auto!important;bottom:10px;width:auto}
.act.ar-l::before{display:block}
.act.ar-l.lo::before,.act.ar-r.lo::before{top:auto;bottom:22px}
.act.ar-t.lo::before,.act.ar-b.lo::before{left:auto;right:24px}
.act.ar-r::before{display:block;left:auto;right:-7px;transform:rotate(225deg)}
.act.ar-t::before{display:block;left:24px;top:-7px;transform:rotate(135deg)}
.act.ar-b::before{display:block;left:24px;top:auto;bottom:-7px;transform:rotate(-45deg)}
.act{left:0;top:0;will-change:transform}
.phone .act{transform:none!important}
.phone .act::before{display:none!important}
.desk .act.v-card{width:208px;padding:12px}
.desk .act h3{flex-direction:column;gap:1px}
.desk .act p{font-size:12px;line-height:1.45}
.desk .v-card .btns{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.desk .v-card .btns button{width:100%;padding:0 6px}
.desk .v-card .v-card .btns button.more{width:100%}
.desk .menu{right:auto;left:-12px;min-width:208px}
.menu{position:absolute;right:0;bottom:36px;min-width:190px;padding:6px;background:rgba(12,10,11,.98);border:1px solid rgba(250,208,44,.24);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.6);display:none;z-index:7}
.menu.on{display:block}
.menu .grp{font:600 10px Rajdhani,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding:6px 8px 3px}
.menu button{display:flex;width:100%;justify-content:space-between;gap:10px;height:auto!important;padding:6px 8px!important;border:0!important;border-radius:7px!important;background:transparent;text-align:left;font-size:12.5px}
.menu button:hover{background:rgba(250,208,44,.08)}
.menu button span{color:var(--mute);font-size:11px}
.btns{position:relative}
svg.map.night{filter:saturate(.7) brightness(.82) hue-rotate(-12deg)}

/* Target preview pill */
.peek{position:absolute;padding:8px 10px;background:rgba(12,10,11,.95);border:1px solid rgba(250,208,44,.3);border-radius:9px;font-size:12px;line-height:1.45;pointer-events:none;z-index:6;max-width:230px;display:none}
.peek.on{display:block}
.peek .n{font-weight:600}
.peek .s{color:var(--soft)}
.peek .go{color:var(--gold);margin-top:3px}
.peek .bad{color:var(--red)}

/* Log = collapsed journal */
.log{position:absolute;left:12px;bottom:12px;width:300px;z-index:4;padding:8px 10px;border-radius:10px;background:rgba(13,11,12,.55);border:1px solid transparent;transition:background .2s,border-color .2s;cursor:pointer}
.log:hover{border-color:var(--line)}
.log .l{font-size:11.5px;color:var(--soft);opacity:.95;line-height:1.5}
.log .l:nth-last-child(2){opacity:.7}.log .l:nth-last-child(3){opacity:.45}
.log .jmore{font-size:10.5px;color:var(--mute);margin-top:2px}
.log.open{background:rgba(13,11,12,.96);border-color:var(--line);max-height:60%;overflow:auto;cursor:default}
.log .day{font:600 10px Rajdhani,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:8px 0 2px}
.log .day:first-child{margin-top:0}
.log.open .l{opacity:1!important}
.phone .log{left:10px;right:10px;width:auto;bottom:auto;top:58px;padding:5px 9px;background:rgba(13,11,12,.6)}
.phone .log:not(.open) .l:not(.last){display:none}
.phone .log:not(.open) .jmore{display:none}

/* Inventory drawer (phone) */
.drawer{position:absolute;left:10px;right:10px;top:56px;padding:12px;background:rgba(13,11,12,.97);border:1px solid var(--line);border-radius:12px;z-index:8;display:none}
.drawer.on{display:block}
.slot{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid rgba(250,208,44,.08);font-size:12.5px}
.slot:first-of-type{border-top:0}
.slot span{color:var(--mute)}

.legend{max-width:1180px;width:100%;display:flex;flex-wrap:wrap;gap:8px 22px;color:var(--mute);font-size:12px}
.legend b{color:var(--ink);font-weight:500}
@keyframes pulse{0%,100%{stroke-opacity:.45}50%{stroke-opacity:.8}}
.closing-edge{animation:pulse 3.2s ease-in-out infinite}

.switch{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:10px;width:max-content;margin:0 auto}
.switch button{height:30px;padding:0 14px;border:0;border-radius:7px;background:transparent;color:var(--soft);font:12.5px Inter,sans-serif;cursor:pointer}
.switch button.on{background:rgba(250,208,44,.14);color:var(--gold)}
.switchwrap{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px}
.switchwrap small{color:var(--mute);font-size:12px;max-width:640px;text-align:center}
/* radial */
.desk .act.v-radial{width:0;height:0;padding:0;background:none;border:0;box-shadow:none}
.v-radial .rb{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:1px solid rgba(250,208,44,.35);background:rgba(13,11,12,.9);color:var(--ink);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(4px);transition:transform .15s,border-color .15s;padding:0}
.v-radial .rb.pri{background:var(--gold);color:#1b1400;border:0}
.v-radial .rb:hover{transform:scale(1.08);border-color:var(--gold)}
.v-radial .rb i{position:absolute;top:47px;color:var(--ink)!important;background:rgba(13,11,12,.8);padding:1px 6px;border-radius:5px;left:50%;transform:translateX(-50%);font:500 10.5px Inter,sans-serif;font-style:normal;color:var(--soft);white-space:nowrap;text-shadow:0 1px 3px #000;pointer-events:none}
.v-radial .rcap{position:absolute;left:0;top:24px;transform:translateX(-50%);text-align:center;white-space:nowrap;pointer-events:none;background:rgba(13,11,12,.82);padding:4px 10px;border-radius:8px;border:1px solid var(--line)}
.v-radial .rcap b{display:block;font:600 12px Rajdhani,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);text-shadow:0 1px 4px #000}
.v-radial .rcap span{font-size:11px;color:var(--red);text-shadow:0 1px 4px #000}
.v-radial .menu{left:-100px;top:60px}
/* pill */
.desk .act.v-pill{width:auto;padding:5px 5px 5px 12px;border-radius:999px;display:flex;align-items:center;gap:10px}
.v-pill .txt{display:flex;flex-direction:column;max-width:230px}
.v-pill .txt b{font:600 11px Rajdhani,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.v-pill .txt span{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-pill .txt .warn{color:var(--red)}
.v-pill .ib{width:34px;height:34px;border-radius:50%;border:1px solid rgba(250,208,44,.3);background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;position:relative}
.v-pill .ib.pri{background:var(--gold);color:#1b1400;border:0}
.v-pill .ib:hover::after{content:attr(data-l);position:absolute;top:40px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--ink);background:rgba(12,10,11,.95);padding:3px 7px;border-radius:6px;white-space:nowrap}
.v-pill .row{display:flex;gap:4px;position:relative}
.v-pill .menu{right:0;left:auto}
/* scene panel */
.desk .act.v-side{left:auto!important;right:56px;top:62px;width:260px;padding:0;overflow:visible;transform:none!important}
.v-side .img{height:118px;border-radius:12px 12px 0 0;background-size:cover;background-position:center;position:relative}
.v-side .img::after{content:"";position:absolute;inset:0;border-radius:12px 12px 0 0;background:linear-gradient(180deg,transparent 40%,rgba(13,11,12,.95))}
.v-side .img b{position:absolute;left:14px;bottom:8px;z-index:1;font:600 15px Rajdhani,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.v-side .body{padding:4px 14px 12px}
.v-side .body p{margin:6px 0 0;font-size:12.5px}
.v-side .opt{display:flex;align-items:center;gap:10px;width:100%;padding:8px 6px;border:0;border-top:1px solid rgba(250,208,44,.08);background:transparent;color:var(--ink);text-align:left;cursor:pointer;font:12.5px Inter,sans-serif}
.v-side .opt:first-of-type{margin-top:8px}
.v-side .opt:hover{background:rgba(250,208,44,.06)}
.v-side .opt small{margin-left:auto;color:var(--mute);font-size:11px}
.v-side .opt.pri{color:var(--gold)}
.v-side .menu{left:0;right:0;top:100%;bottom:auto}
.v-side .btns{position:relative}
.tether{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}

@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
.v-side .sec{margin-top:12px;font:600 10px Rajdhani,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.v-side .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.v-side .chip{height:26px;padding:0 9px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--soft);font:12px Inter,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.v-side .chip:hover{color:var(--ink);border-color:rgba(250,208,44,.4)}
.v-side .bag{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px}
.v-side .item{aspect-ratio:1;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--ink);font:11px Inter,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;position:relative}
.v-side .item small{font-size:10px;color:var(--mute)}
.v-side .item span{font-size:10.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px}
.v-side .item.held{border-color:rgba(250,208,44,.55)}
.v-side .item:hover{border-color:var(--gold)}
.v-side .item:hover small{color:var(--gold)}
.v-side .ctx{margin-top:10px;padding:8px 10px;border-radius:9px;background:rgba(236,232,227,.05);border:1px solid rgba(236,232,227,.12);font-size:12px}
.v-side .ctx .r{display:flex;gap:6px;margin-top:6px}
.v-side .ctx button{flex:1;height:26px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--ink);font:12px Inter,sans-serif;cursor:pointer}
.v-side .ctx button:hover{border-color:var(--gold)}

.rh{display:flex;align-items:center;gap:3px;margin-right:2px}
.rh i{width:16px;height:4px;border-radius:2px;background:rgba(255,255,255,.13);transition:background .3s}
.rh i.done{background:rgba(250,208,44,.32)}
.rh i.now{background:var(--gold);box-shadow:0 0 8px rgba(250,208,44,.55)}
.costing .rh i.now{animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.rh i.moon{width:auto;height:auto;background:none;box-shadow:none;font-style:normal;font-size:11px;color:var(--mute);margin-left:2px}
.phone .rh i{width:10px}
.bar i{transition:width .8s ease,background .8s}
.words em{font-style:normal}.c-r{color:#ff8f7d!important}.c-b{color:#8fb4ff!important}.c-y{color:#e9c46a!important}.c-g{color:#9bd59b!important}.c-m{color:var(--soft)!important}
.v-side .intent{margin:10px 0 2px;padding-left:10px;border-left:2px solid var(--gold);font-size:13px;line-height:1.45;color:var(--ink)}
.v-side .fore{margin:6px 0 0;min-height:34px;font-size:11.5px;line-height:1.45;color:var(--soft)}
.v-side .fore .cost{display:block;color:var(--gold);opacity:.8;font-size:11px}
.v-side .opt.pri{color:var(--gold)}
.v-side .opt.pri small{color:rgba(250,208,44,.7)}
.v-side .item:disabled{opacity:.35;cursor:default}
.v-side .item:disabled:hover{border-color:var(--line)}
.desk .act.v-side{max-height:calc(100% - 76px);overflow:auto}
.phone .act.v-side{padding:4px 12px 10px;max-height:300px;overflow:auto}
.phone .act.v-side .body{padding:0}
.phone .phn{font:600 12px Rajdhani,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-top:8px}
.phone .v-side .intent{margin-top:6px}
.phone .v-side .opt{padding:7px 4px}
.phone .v-side .ctx.ph1{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;margin-top:6px}
.phone .v-side .ctx.ph1 button{flex:none;height:26px;padding:0 10px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--ink);font:12px Inter,sans-serif}
.phone .v-side .fore{min-height:0;margin-top:4px}
.phone .v-side .opt{padding:6px 4px}
.phone .v-side .opt.sel{background:rgba(250,208,44,.08);border-radius:6px}
.beckon{animation:beck 1.8s ease-in-out infinite}
@keyframes beck{50%{fill-opacity:.35;stroke-opacity:.5}}
.fls{position:absolute;inset:0;pointer-events:none;z-index:9}
.fl{position:absolute;transform:translate(-50%,0);font:600 12px Inter,sans-serif;white-space:nowrap;padding:3px 8px;border-radius:999px;background:rgba(12,10,11,.85);border:1px solid currentColor;animation:rise 1.9s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translate(-50%,6px)}15%{opacity:1;transform:translate(-50%,0)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-46px)}}
.modal{position:absolute;inset:0;z-index:12;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 50%,rgba(8,6,7,.55),rgba(8,6,7,.88));backdrop-filter:blur(2px)}
.modal.on{display:flex}
.mcard{width:300px;max-width:calc(100% - 32px);padding:18px 18px 14px;background:rgba(15,12,13,.97);border:1px solid rgba(250,208,44,.25);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.6);text-align:center;animation:pop .35s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}}
.mcard svg{display:block;margin:0 auto 8px}
.mt{font:600 13px Rajdhani,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.who{font-size:15px;font-weight:500;margin-top:4px}
.read{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin:10px 0 12px}
.read span{font-size:11.5px;color:var(--soft);padding:3px 8px;border:1px solid var(--line);border-radius:999px}
.mbtn{display:block;width:100%;margin-top:6px;padding:9px 12px;border-radius:10px;border:1px solid rgba(250,208,44,.25);background:transparent;color:var(--ink);font:500 13px Inter,sans-serif;text-align:left;cursor:pointer}
.mbtn small{display:block;font-weight:400;font-size:11.5px;color:var(--mute);margin-top:2px}
.mbtn:hover{border-color:var(--gold);background:rgba(250,208,44,.05)}
.mbtn.pri{background:var(--gold);color:#1b1400;border:0;text-align:center;font-weight:600}
.res{font-size:13px;line-height:1.5;margin:10px 0 4px}
.res.dim{color:var(--soft);font-size:12px}
.res.warnl{color:var(--red);font-size:12px}
.moonbig{font-size:34px;color:#cfd6ff;line-height:1;margin-bottom:6px;text-shadow:0 0 20px rgba(160,180,255,.5)}

@keyframes youglow{0%,100%{stroke-opacity:.95;stroke-width:2.6}50%{stroke-opacity:.35;stroke-width:5}}
@keyframes youfill{0%,100%{fill-opacity:.03}50%{fill-opacity:.13}}
.youedge{animation:youglow 2.4s ease-in-out infinite}
.youfill{animation:youfill 2.4s ease-in-out infinite}
.v-side .optw .of{display:none;padding:0 6px 8px 32px;font-size:11.5px;line-height:1.45;color:var(--soft)}
.v-side .of.row{padding:6px 2px 0}
.v-side .of.show{display:block;animation:ofin .18s ease-out}
@keyframes ofin{from{opacity:0;transform:translateY(-3px)}}
.v-side .of .cost{display:block;color:var(--gold);opacity:.85;font-size:11px;margin-top:1px}
.v-side .sec span{text-transform:none;letter-spacing:0;font:11px Inter,sans-serif;color:var(--mute)}
.v-side .paths .opt{padding:6px;font-size:12.5px}
.v-side .paths .opt:first-child{margin-top:0}
.v-side .optw:first-child .opt{margin-top:8px}
.v-side .paths .optw:first-child .opt{margin-top:4px}

.al{width:22px;height:22px;border-radius:50%;border:1px solid #9bd59b;color:#9bd59b;display:grid;place-items:center;font:600 10px Inter,sans-serif;background:rgba(155,213,155,.08)}
.al.sus{border-color:#ff8f7d;color:#ff8f7d;animation:blink 1.6s ease-in-out infinite}
.tribbtn{margin-right:-4px}
.v-side .allytip{margin:8px 0 0;padding:6px 9px;border-radius:8px;background:rgba(155,213,155,.06);border:1px solid rgba(155,213,155,.2);font-size:12px;color:var(--soft)}
.v-side .allytip b{color:#9bd59b;font-weight:500}
.res.sign{color:#ffb3a6;font-style:italic;font-size:12.5px}
.mcard .big{font-size:15px}
.mcard.trib{width:560px;max-width:calc(100% - 20px);max-height:calc(100% - 30px);overflow:auto;text-align:left}
.trib .mt,.trib>.res{text-align:center}
.lg{font-size:10.5px;padding:1px 6px;border-radius:999px;border:1px solid;margin-left:4px}
.lg.ally{color:#9bd59b;border-color:rgba(155,213,155,.45)}.lg.fri{color:#8fb4ff;border-color:rgba(143,180,255,.4)}.lg.hos{color:#ff8f7d;border-color:rgba(255,143,125,.4)}.lg.car{color:var(--gold);border-color:rgba(250,208,44,.4)}
.dlist{margin-top:10px;display:flex;flex-direction:column}
.drow{display:grid;grid-template-columns:22px 86px 1fr;gap:8px;align-items:center;padding:6px 0;border-top:1px solid rgba(250,208,44,.07)}
.drow .dn{font:600 13px Rajdhani,sans-serif;color:var(--mute)}.drow.car .dn{color:var(--gold)}
.drow .dt{font-size:11px;color:var(--mute)}
.drow.mine{background:rgba(250,208,44,.04)}
.tch{display:flex;flex-wrap:wrap;gap:4px}
.tchip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font:12px Inter,sans-serif;cursor:pointer}
.tchip i{font-style:normal;font-size:10px;color:var(--mute)}
.tchip .tp{color:var(--gold)}
.tchip.you{border-color:var(--gold);color:var(--gold);cursor:default}
.tchip.dead{color:var(--mute);text-decoration:line-through;border-style:dashed}
.tchip.ally{border-color:#9bd59b;color:#9bd59b}.tchip.fri{border-color:rgba(143,180,255,.6)}.tchip.hos{border-color:rgba(255,143,125,.6);color:#ffb3a6}
.tchip.on{background:rgba(250,208,44,.1)}
.tdet{margin:12px 0 0;font-size:12px;color:var(--soft);min-height:32px;line-height:1.5}
.tdet b{color:var(--ink);font-weight:500}
.phone .drow{grid-template-columns:20px 1fr}.phone .drow .dt{display:none}
.res.deadly{color:#fff;background:rgba(232,96,79,.25);border:1px solid rgba(255,143,125,.6);border-radius:9px;padding:8px 10px;font-weight:500}

/* full-screen game (one view, desktop or phone layout by width) */
html,body{height:100%;overflow:hidden}
.frame.game{position:fixed;inset:0;width:100vw;max-width:none;height:100vh;height:100dvh;border:0;border-radius:0}

.al{cursor:pointer}.al:hover{background:rgba(155,213,155,.2)}
.arow{display:flex;gap:6px;margin-top:6px}.arow .mbtn{margin:0;font-size:12px;padding:8px 6px}
.arow .killally{border-color:rgba(255,143,125,.4);color:#ffb3a6}
.mbtn.betrayb{border-color:rgba(255,143,125,.35)}.mbtn.betrayb:hover{border-color:#ff8f7d;background:rgba(255,143,125,.06)}
.tdet a{color:var(--gold)}
.mcard.gift .chute{width:64px;height:64px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(220,225,235,.5);background:radial-gradient(circle,rgba(220,225,235,.18),transparent 70%);box-shadow:0 0 40px rgba(220,225,235,.2);color:#e6e9f0;animation:drift 2.4s ease-in-out infinite}
.mcard.gift .chute svg{width:30px;height:30px;margin:0}
@keyframes drift{50%{transform:translateY(-5px)}}
</style>
</head>

  <div class="setup">
    <div class="sh">Your tribute</div>
    <label class="lb">District</label><div class="dists" id="dists"></div><p class="trade" id="trade"></p>

    <label class="lb">Size</label><div class="seg" id="segSize"></div>
    <label class="lb">Tributes</label><div class="seg" id="segPl"></div>
    <button id="enter">Enter the arena</button>
  </div></div></div>

// ---------- shared world ----------

const R=rng((Math.random()*1e9)|0);
let SETUP={size:48,players:24,district:1,S:7,D:7,P:6};try{const j=sessionStorage.getItem("arenaSetup");if(j)SETUP=Object.assign(SETUP,JSON.parse(j))}catch(e){}
const W=1600,H=1600,N=SETUP.size;const SP=Math.min(150,Math.sqrt(Math.PI*752*752/N)*.72);const ZS=95/SP;
const pts=[];
// jittered grid inside a blob
let tries=0;while(pts.length<N&&tries++<200000){const x=R()*W,y=R()*H;const d=Math.hypot(x-W/2,y-H/2);if(d<W*.47 && pts.every(p=>Math.hypot(p[0]-x,p[1]-y)>SP))pts.push([x,y]);}
const NREAL=pts.length;for(let k=0;k<44;k++){const t=k/44*Math.PI*2;pts.push([W/2+Math.cos(t)*W*.54,H/2+Math.sin(t)*H*.54])}

const NAMES={forest:["Pine Hollow","Old Forest","Mossback","Deep Pines"],swamp:["Black Marsh","Reed Mire","Sump","Drowned Wood"],lake:["Still Lake","Cold Pool","Grey Shallows","Mirror Water"],
  mountain:["Rockfall","High Scree","Broken Ridge","Eagle Step"],plains:["Open Field","Long Grass","Wide Meadow","Bare Hill"],jungle:["Vine Tangle","Green Dark","Rot Garden","Canopy Floor"],
  desert:["Red Dunes","Salt Flat","Glass Sand","Bone Basin"],tundra:["White Waste","Frost Plain","Lichen Flats","Grey Steppe"],woods:["Birch Wood","Thin Wood","Ash Copse","Silver Stand"],
  savanna:["Dry Grass","Acacia Rise","Lion Flats","Yellow Reach"],glacier:["Ice Shelf","Blue Crevasse","Frozen Falls","Snow Bowl"],caatinga:["Thorn Scrub","Dust Bush","Cactus Run","Dry Wash"],
  industrial:["Rust Yard","Old Works","Pipe Maze","Slag Heap"]};

  woods:"Aranya Arena",forest:"Ka’aguay Arena",jungle:"Yvapurũ Arena",swamp:"Pantanari Arena",lake:"Mayu Arena",industrial:"Karkhan Arena"};
const ARENA_LINE={glacier:"Ice, mostly. The nights will kill more than the knives.",tundra:"Frozen plains. Nowhere to hide from the wind.",mountain:"Rock and scree. Watch your footing.",
  desert:"Sand, mostly. Water will be worth more than weapons.",caatinga:"Thorn and dust. Thirst comes fast here.",savanna:"Dry grass to the horizon. You'll be seen from far away.",
  plains:"Open ground. Easy to run, hard to hide.",woods:"Thin woods. Cover, but not much.",forest:"Deep forest. Plenty of cover. Plenty of things in it.",
  jungle:"Jungle, thick and wet. Food everywhere, and things that eat you.",swamp:"Marsh and black water. Every step is slow.",lake:"Lakes and cold water. Never thirsty, often stuck.",
  industrial:"Rust and ruins. Loot in every building, and air you shouldn't breathe."};

const THEMATIC=R()<.7;const DOM=THEMATIC?BIOMES[Math.floor(R()*BIOMES.length)]:null;
const ARENA={name:THEMATIC?ARENA_NAME[DOM]:"Survival Arena",dom:DOM,line:THEMATIC?ARENA_LINE[DOM]:"A bit of everything. Learn each place as you go."};
const bseeds=[];BIOMES.forEach(b=>{const k=THEMATIC?(b===DOM?30:1):2;for(let j=0;j<k;j++)bseeds.push([b,W*.06+R()*W*.88,H*.06+R()*H*.88])});
const nameIdx={};
const TAGW={desert:[1,.35,.45,.25,.6],caatinga:[1,.35,.45,.25,.6],savanna:[1,.35,.45,.25,.6],plains:[1,.35,.45,.25,.6],glacier:[.85,.3,.35,.55,.7],tundra:[.85,.3,.35,.55,.7],
  mountain:[.6,.55,.45,.3,.6],woods:[.3,.95,.6,.55,.35],forest:[.3,.95,.6,.55,.35],jungle:[.3,.95,.6,.55,.35],swamp:[.35,.55,.35,.8,.55],lake:[.35,.55,.35,.8,.55],industrial:[.45,.55,.8,.2,.6]};

function pickHazard(b){if(["desert","caatinga","savanna"].includes(b))return"heat";if(["glacier","tundra"].includes(b))return"cold";if(["swamp","lake"].includes(b))return"flooded";
  if(b==="industrial")return R()<.65?"toxic":"unstable";if(b==="mountain")return"unstable";return["heat","cold","toxic","unstable","flooded"][Math.floor(R()*5)]}
const CREATURES={cold:[["Wolf-Bear",15,25],["Iron Eagle",10,18],["Thermal Serpent",8,12],["Mimetic Yeti",20,30]],arid:[["Whip Scorpion",12,20],["Bomb Armadillo",25,35],["Vigilant Vulture",5,10],["Glass Lizard",10,15]],
  green:[["Tracker Wasp",8,14],["Shadow Panther",18,28],["Howler Monkey",5,12],["Thorn Wolf",12,22]],special:[["Giant Bullfrog",15,20],["Blade Dragonfly",10,16],["Mechanical Dog",20,30],["Pulse Eel",15,25]]};
const B2G={glacier:"cold",tundra:"cold",mountain:"cold",desert:"arid",caatinga:"arid",savanna:"arid",plains:"green",woods:"green",forest:"green",jungle:"green",swamp:"special",lake:"special",industrial:"special",cornucopia:"special"};
const MODS=[["Brutal","add",10],["Ferocious","add",5],["Alpha","mul",1.5],["Venomous","poison"],["Toxic","poison"],["Hungry","flavor"],["Ancient","flavor"],["Blind","flavor"],["Giant","add",6],["Wounded","weak"]];

  const dc=Math.hypot(cx-W/2,cy-H/2);

});

cells[corn].biome="cornucopia";cells[corn].name="Cornucopia";
const maxd=Math.max(...cells.map(c=>c.dc));
cells.forEach(c=>{c.closed=false;c.closing=false});
cells.forEach(c=>{const xs=c.poly.map(q=>q[0]),ys=c.poly.map(q=>q[1]);c.bx=Math.min(...xs);c.by=Math.min(...ys);c.bw=Math.max(...xs)-c.bx;c.bh=Math.max(...ys)-c.by});
// per-area personality
cells.forEach(c=>{if(c.biome==="cornucopia"){c.tags=["rich","exposed"];return}
  c.tags=pickTags(c.biome);c.hazard=c.tags.includes("hazard")?pickHazard(c.biome):null;
  c.water=c.biome==="lake"?"clean":c.biome==="swamp"?"murky":null;

});

// guarantee one creature and one structure near the start so the systems show up early

  flooded:{n:"Flooded",t:"Water tugs at every step.",peek:"Standing water, knee-deep.",tone:"b"},toxic:{n:"Fumes",t:"A sharp chemical smell stings your lungs.",peek:"A chemical stink drifts from there.",tone:"y"},
  unstable:{n:"Loose ground",t:"The ground here is treacherous.",peek:"Loose rock. Careful.",tone:"y"}};

const FORAGE={forest:["fruit","roots"],jungle:["fruit","fruit","roots"],woods:["roots","fruit"],plains:["roots"],savanna:["roots"],lake:["fish"],swamp:["fish","roots"],mountain:["roots"],caatinga:["roots"],tundra:[],glacier:[],desert:[],industrial:[],cornucopia:[]};

cells.forEach(c=>{c.ground=[];if(c.biome==="cornucopia")return;const n=c.tags.includes("rich")?2:R()<.22?1:0;

    const hit=document.elementFromPoint(e.clientX,e.clientY);const t=hit&&hit.closest?hit.closest(".cell.reach"):null;
    if(!t){sel=null;hidePeek();return}
    const i=+t.dataset.i;
    if(state.modal)return;
    if(!isPhone){perform("go",i);return}
    if(sel===i){perform("go",i)}else{sel=i;showRoute(i)}
  });
  const pick=t=>t.closest("[data-a]")||(t.closest(".optw")?t.closest(".optw").querySelector("[data-a]"):null);
  act.addEventListener("click",e=>{const bt=pick(e.target);if(!bt||bt.disabled)return;
    if(isPhone&&psel!==bt.dataset.k){psel=bt.dataset.k;showFore(bt);return}
    psel=null;perform(bt.dataset.a,bt.dataset.to!==undefined?+bt.dataset.to:undefined)});
  act.addEventListener("mouseover",e=>{if(isPhone)return;const bt=pick(e.target);if(bt&&!bt.disabled)showFore(bt)});
  act.addEventListener("mouseleave",()=>{if(!isPhone)showFore(null)});
  root.querySelector(".allies").addEventListener("click",e=>{const t=e.target.closest("[data-allyopen]");if(!t||state.modal)return;e.stopPropagation();state.modal={k:"allyopts",n:t.dataset.allyopen};rerenderAll()});
  root.querySelector(".tribbtn").addEventListener("click",e=>{e.stopPropagation();if(state.modal)return;state.modal={k:"tributes"};rerenderAll()});
  root.querySelector(".menubtn").addEventListener("click",e=>{e.stopPropagation();if(state.modal)return;state.modal={k:"menu"};rerenderAll()});
  // bars: tap shows words
  const bars=root.querySelector(".bars"),pop=root.querySelector(".pop");
  bars.addEventListener("click",e=>{e.stopPropagation();pop.classList.toggle("on")});
  const bag=root.querySelector(".bag"),drawer=root.querySelector(".drawer");
  if(bag)bag.addEventListener("click",e=>{e.stopPropagation();drawer.classList.toggle("on")});
  root.addEventListener("click",e=>{if(!e.target.closest(".more")){const m=act.querySelector(".menu");if(m)m.classList.remove("on")}if(!bars.contains(e.target))pop.classList.remove("on");if(drawer&&!drawer.contains(e.target)&&e.target!==bag)drawer.classList.remove("on")});
  return{render,modalOnly(){renderModal();root.querySelector('.alive').textContent=state.alive},resetCam(){sel=null;cam.px=0;cam.py=0;cam.whole=false;if(cam.z<Z0*.8)cam.z=Z0}};
}
// one full-screen view; phone layout under 760px wide
let FULL_PHONE=null;
function mount(){const phone=innerWidth<760;if(phone===FULL_PHONE&&views.length)return;FULL_PHONE=phone;
  const old=document.getElementById("game");const el=document.createElement("div");el.id="game";el.className="frame game "+(phone?"phone":"desk");old.replaceWith(el);
  views.length=0;views.push(makeView(el,phone));rerenderAll()}
mount();
state.modal={k:"intro"};
{const td=document.getElementById('tdeath');if(td)td.onclick=e=>{e.preventDefault()}}
rerenderAll();
const T=document.getElementById('title');
if(location.hash==='#play')T.remove();else{const cfg=Object.assign({},SETUP);
  const ATTR=[["S","Strength","Strikes first. Hits harder."],["D","Dexterity","Quick hands. First to the loot."],["P","Perception","Sharper senses. Harder to ambush."]];
  const PRE={1:[6,7,7,"Luxury","Raised soft, trained hard. Polished."],2:[9,6,5,"Masonry","Stone-strong. Trained for this since childhood."],3:[4,7,9,"Technology","Quick mind, weak arms. Sees everything."],4:[7,8,5,"Fishing","Nets, knots and tridents. Good in water."],
    5:[6,6,8,"Power","Patient. Notices what others miss."],6:[6,8,6,"Transport","Fast on their feet."],7:[8,7,5,"Lumber","Strong arms. At home with an axe."],8:[5,9,6,"Textiles","Clever hands. Makes things."],
    9:[6,6,8,"Grain","Steady. Reads the land."],10:[8,5,7,"Livestock","Tough. Knows animals — and mutts."],11:[5,7,8,"Agriculture","Knows every plant. Never goes hungry."],12:[8,5,7,"Mining","Hard as coal. Used to the dark."]};
  const setDist=d=>{cfg.district=d;[cfg.S,cfg.D,cfg.P]=PRE[d]};if(!sessionStorage.getItem||1){try{if(!sessionStorage.getItem("arenaSetup"))setDist(cfg.district)}catch(_){setDist(cfg.district)}}
  const WORD={12:"Twelve",24:"Twenty-four",36:"Thirty-six",48:"Forty-eight"};
  const draw=()=>{const used=cfg.S+cfg.D+cfg.P,left=20-used;
    document.getElementById('dists').innerHTML=Array.from({length:12},(_,i)=>`<button class="${cfg.district===i+1?"on":""}" data-d="${i+1}">${i+1}</button>`).join("");
    const pr=PRE[cfg.district];const custom=pr[0]!==cfg.S||pr[1]!==cfg.D||pr[2]!==cfg.P;
    document.getElementById('trade').innerHTML=`<b>${pr[3]}</b> — ${pr[4]}${custom?` <span class="cust">Customised · <a href="#" id="rst">reset</a></span>`:""}`;
    document.getElementById('attrs').innerHTML=ATTR.map(([k,n,h])=>`<div class="ar"><div class="an"><b>${n}</b><span>${h}</span></div><div class="pips" data-k="${k}">${Array.from({length:10},(_,i)=>`<i class="${i<cfg[k]?"on":""}" data-v="${i+1}"></i>`).join("")}</div></div>`).join("");
    document.getElementById('left').innerHTML=left>0?`<span class="lp">${Array.from({length:left},()=>"<i></i>").join("")}</span> ${left} point${left>1?"s":""} left to give`:`<span class="ok">Ready.</span> Every point given.`;
    document.getElementById('segSize').innerHTML=[[24,"Small"],[48,"Medium"],[72,"Large"],[120,"Huge"]].map(([v,n])=>`<button class="${cfg.size===v?"on":""}" data-s="${v}"><b>${n}</b><span>${v} areas</span></button>`).join("");
    document.getElementById('segPl').innerHTML=[12,24,36,48].map(v=>`<button class="${cfg.players===v?"on":""}" data-p="${v}"><b>${v}</b></button>`).join("");
    document.getElementById('tag').textContent=`${WORD[cfg.players]} enter. One leaves.`;
    document.getElementById('enter').disabled=left!==0};
  T.addEventListener('click',e=>{if(e.target.id==='rst'){e.preventDefault();setDist(cfg.district);return draw()}const t=e.target.closest('button,i');if(!t)return;
    if(t.dataset.d)setDist(+t.dataset.d);
    else if(t.dataset.s)cfg.size=+t.dataset.s;
    else if(t.dataset.p)cfg.players=+t.dataset.p;
    else if(t.dataset.v){const k=t.parentElement.dataset.k;let v=+t.dataset.v;if(v===cfg[k])v--;const others=20-(cfg.S+cfg.D+cfg.P-cfg[k]);cfg[k]=Math.max(0,Math.min(v,others,10))}
    else if(t.id==='enter'){try{sessionStorage.setItem('arenaSetup',JSON.stringify(cfg))}catch(_){}location.hash='play';location.reload();return}
    draw()});
  draw()}

addEventListener("resize",()=>{mount();rerenderAll()});
</script>
